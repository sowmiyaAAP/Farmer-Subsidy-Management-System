<!DOCTYPE html>
<html>
<head>
    <title>Subsidy Status</title>
</head>
<body>

<h1>Subsidy Status</h1>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Subsidy Type</th>
        <th>Amount</th>
        <th>Status</th>
    </tr>

    {% for row in data %}
    <tr>
        <td>{{ row["name"] }}</td>
        <td>{{ row["subsidy_type"] }}</td>
        <td>{{ row["amount"] }}</td>
        <td>{{ row["status"] }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
