<!DOCTYPE html>
<html>
<head>
    <title>Apply for Subsidy</title>
</head>
<body>

<h1>Apply for Subsidy</h1>

<form method="POST">

    <input type="text" name="name" placeholder="Farmer Name" required>
    <br><br>

    <input type="text" name="subsidy_type" placeholder="Subsidy Type" required>
    <br><br>

    <input type="text" name="amount" placeholder="Amount Required" required>
    <br><br>

    <textarea name="reason" placeholder="Reason for Subsidy" required></textarea>
    <br><br>

    <button type="submit">Submit Application</button>

</form>

</body>
</html>
